[project]
name = "knowledgehub"
version = "0.1.0"
description = "KnowledgeHub — multi-document RAG assistant with chat memory"
requires-python = ">=3.12,<3.13"

# Loose constraints on purpose: the plan says let the solver resolve, then record
# what it picked in obsidian_vault/Technology Documentation Links.md. Only two
# version facts are load-bearing — Python 3.12 (pinned above, because 3.14 is
# also installed on this machine) and Qdrant >= 1.14 (pinned in docker-compose,
# because below it the rrf object has no weights/k, which breaks RRF_MAX).
dependencies = [
    "fastapi (>=0.115,<1.0)",
    "uvicorn[standard] (>=0.30,<1.0)",
    "python-multipart (>=0.0.9,<1.0)",
    "pydantic (>=2.7,<3.0)",
    "pydantic-settings (>=2.3,<3.0)",
    "sqlalchemy[asyncio] (>=2.0,<3.0)",
    "asyncpg (>=0.29,<1.0)",
    "alembic (>=1.13,<2.0)",
    "qdrant-client (>=1.14,<2.0)",
    "fastembed (>=0.4,<1.0)",
    "langgraph (>=0.2,<2.0)",
    "clerk-backend-api (>=1.0,<4.0)",
    "cohere (>=5.13,<6.0)",
    "pypdf (>=5.0,<7.0)",
    "pdfplumber (>=0.11,<1.0)",
    "pypdfium2 (>=4.30,<6.0)",
    "httpx (>=0.27,<1.0)",
]

[tool.poetry]
# This is an application, not a library — nothing to build or install as a package.
package-mode = false

# deepeval and the test toolchain never enter the runtime image. The Dockerfile
# runs `poetry install --no-root --only main`, which is what keeps the image
# inside the 512 MB Render ceiling.
[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
pytest-asyncio = ">=0.24,<2.0"
deepeval = ">=1.0,<4.0"
ruff = ">=0.6,<1.0"
mypy = ">=1.11,<2.0"
# Authors the PDF fixtures the Tier-1 parser is tested against. Generating them
# beats committing binaries: the test states what the document contains, so a
# parser regression is legible rather than a diff against an opaque blob.
reportlab = ">=4.2,<5.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic writes these; reformatting generated migrations by hand invites the
# next autogenerate to undo the edit. env.py is hand-written and stays linted.
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# ASYNC109 flags `timeout` parameters on async functions, on the assumption they
# hand-roll what `asyncio.timeout()` does. Ours delegate to httpx, which applies
# separate connect/read/write budgets — strictly better than wrapping the call in
# a single outer deadline. The contract's §5 table is expressed as per-dependency
# timeouts, so the parameter is the interface, not an implementation detail.
#
# B008 forbids function calls in argument defaults. `Depends(...)` and `File(...)`
# in a default *is* the FastAPI idiom — the framework reads them off the signature
# to build the dependency graph — so the rule is simply wrong for this framework.
ignore = ["ASYNC109", "B008"]

[tool.ruff.lint.per-file-ignores]
# questions.py is the golden set transcribed verbatim from the question bank.
# Reflowing the question strings to 100 columns would make them stop matching the
# source document line for line, which is the only way to check the transcription.
"evals/questions.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
