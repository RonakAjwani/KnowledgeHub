# KnowledgeHub - full local stack.
#
# This file is the durable deliverable: managed free-tier Postgres instances
# (Render's was deleted 44 days after creation; Azure's free tier has its own
# limits) are not permanent, so Compose is what still works after a live link
# dies. It must stay in parity with the deployed setup - if a service gets an
# env var in the cloud deployment, it gets one here too.
#
#   docker compose up --build
#
# Runs with AUTH_MODE=dev by default, so no Clerk keys are needed to bring the
# stack up. Set LLM keys in backend/.env (see backend/.env.example).

services:
  qdrant:
    # The server version is load-bearing, and the floor is higher than the
    # vault's "1.14+" note assumed. 1.14 introduced weighted RRF, but the
    # `{"rrf": {"k": ..., "weights": [...]}}` query object - the only form that
    # lets us pin `k` - is newer: 1.15.1 rejects it outright with
    # "Expected some form of vector, id, or a type of query".
    # Without a settable `k`, RRF_MAX is derived from a server default we cannot
    # see, and every G2 threshold silently means nothing (I7).
    # Pinned, not :latest, so the API cannot move underfoot.
    image: qdrant/qdrant:v1.18.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The Qdrant image is distroless - no curl, no bash. It does ship its own
      # binary, which answers a stdio healthcheck.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: knowledgehub
      POSTGRES_PASSWORD: knowledgehub
      POSTGRES_DB: knowledgehub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgehub -d knowledgehub"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Service names inside the compose network, overriding the localhost
      # defaults that local `poetry run` development uses.
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+asyncpg://knowledgehub:knowledgehub@postgres:5432/knowledgehub
      # Threaded BLAS costs more in contention than it buys in throughput on a
      # low-vCPU container. Set here too so Compose reproduces the deployed shape.
      OMP_NUM_THREADS: "1"
      AUTH_MODE: dev
      CORS_ORIGINS: http://localhost:3000
    volumes:
      # Persist the fastembed ONNX model across restarts - it is ~130 MB and
      # re-downloading it on every `up` is a slow, pointless round trip.
      - fastembed_cache:/app/.fastembed_cache
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Baked at build time: NEXT_PUBLIC_* is inlined into the client bundle,
        # so it cannot be supplied at run time.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  qdrant_storage:
  pgdata:
  fastembed_cache:
